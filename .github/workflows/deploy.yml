name: Deploy to Nekoweb

on:
    push:
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout all branches
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Prepare deploy directory
              shell: bash
              run: |
                  set -e

                  mkdir -p deploy

                  DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

                  echo "Default branch: $DEFAULT_BRANCH"
                  echo "Branches to deploy:"

                  # Deploy the default branch to the site root
                  git archive "origin/$DEFAULT_BRANCH" | tar -x -C deploy

                  # Deploy every other branch under /old/{branch}/
                  while read -r branch; do
                    [ -z "$branch" ] && continue

                    # Skip the default branch
                    if [ "$branch" = "$DEFAULT_BRANCH" ]; then
                      continue
                    fi

                    echo "Deploying branch: $branch"

                    mkdir -p "deploy/old/$branch"

                    git archive "origin/$branch" | tar -x -C "deploy/old/$branch"
                  done < <(
                    git for-each-ref \
                      --format='%(refname:strip=3)' \
                      refs/remotes/origin/ |
                      grep -v '^HEAD$'
                  )

            - name: Show final deploy directory
              run: |
                  echo "Final deployment:"
                  find deploy -type f | sort

            - name: Deploy
              uses: indiefellas/deploy2nekoweb@main
              with:
                  nekoweb-api-key: ${{ secrets.NEKOWEB_API_KEY }}
                  nekoweb-domain: "hoshiai.space"
                  nekoweb-username: "meowbyte"
                  directory: "deploy"
