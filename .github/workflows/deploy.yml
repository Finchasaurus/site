name: Deploy to Nekoweb

on:
    push:
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Show files
              run: |
                  pwd
                  ls -la
                  find . -maxdepth 2 -type f | sort

            - name: Prepare deploy directory
              run: |
                  mkdir deploy

                  if [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ]; then
                    # Default branch -> /
                    rsync -a ./ ./deploy/ \
                      --exclude .git \
                      --exclude .github \
                      --exclude deploy \
                      --exclude deploy2nekoweb
                  else
                    # Other branches -> /old/<branch>
                    mkdir -p "deploy/old/${GITHUB_REF_NAME}"

                    rsync -a ./ "deploy/old/${GITHUB_REF_NAME}/" \
                      --exclude .git \
                      --exclude .github \
                      --exclude deploy \
                      --exclude deploy2nekoweb
                  fi

            - name: Show deploy directory
              run: |
                  find deploy -maxdepth 4 -type f | sort

            - name: Deploy
              uses: indiefellas/deploy2nekoweb@main
              with:
                  nekoweb-api-key: ${{ secrets.NEKOWEB_API_KEY }}
                  nekoweb-domain: "hoshiai.space"
                  nekoweb-username: "meowbyte"
                  directory: "deploy"
