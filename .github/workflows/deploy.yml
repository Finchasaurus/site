name: Deploy to Nekoweb

on:
    push:
        branches:
            - "**"
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest

        if: github.ref_name == github.event.repository.default_branch

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Build site (src/ layout -> Nekoweb layout)
              run: python3 site_map.py build deploy

            - name: Show files
              run: |
                  pwd
                  ls -la deploy
                  find deploy -type f | sort

            - name: Deploy
              uses: indiefellas/deploy2nekoweb@main
              with:
                  nekoweb-api-key: ${{ secrets.NEKOWEB_API_KEY }}
                  nekoweb-domain: "hoshiai.space"
                  nekoweb-username: "meowbyte"
                  directory: "deploy"
