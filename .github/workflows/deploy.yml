name: Deploy to Nekoweb

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show files
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f | sort

      - name: Prepare deploy directory
        run: |
          mkdir deploy
          rsync -a ./ ./deploy \
            --exclude .git \
            --exclude .github \
            --exclude deploy \
            --exclude deploy2nekoweb

      - name: Deploy
        uses: indiefellas/deploy2nekoweb@main
        with:
          nekoweb-api-key: ${{ secrets.NEKOWEB_API_KEY }}
          nekoweb-domain: "hoshiai.space"
          nekoweb-username: "meowbyte"
          directory: "deploy"